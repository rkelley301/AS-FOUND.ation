function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function norm(x) { return String(x).toLowerCase().replace(/[^a-z0-9.]/g, "").replace(/%$/, ""); }

function safetyScore(s) {
  const vaultPts = CARDS.reduce((acc, c) => acc + ((s.vault[c.id] && s.vault[c.id].lvl) || 0) / 3, 0) / CARDS.length;
  const zonePts = ZONES.filter(z => s.zones[z.id] && s.zones[z.id].cleared).length / (ZONES.length || 1);

  return Math.round(vaultPts * 40 + zonePts * 20 + scenPts * 25 + bossPts * 15);
}

let AC = null;
function beep(freqs, dur = 0.09, type = "square", vol = 0.05) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    freqs.forEach(f => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f; g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
      t += dur * 0.9;
    });
  } catch (e) {}
}

function useKeys(handler, deps) { useEffect(() => { const f = e => { if (e.target && e.target.tagName === "INPUT") return; handler(e); }; window.addEventListener("keydown", f); return () => window.removeEventListener("keydown", f); }, deps); }
function useWide() { const [w, setW] = useState(window.innerWidth); useEffect(() => { const f = () => setW(window.innerWidth); window.addEventListener("resize", f); return () => window.removeEventListener("resize", f); }, []); return w >= 900; }
function Verdict({ ok, why, r, children }) { return <div style={{ marginTop: 14, borderRadius: 14, padding: 16, display: "flex", gap: 14, alignItems: "flex-start", background: ok ? `${C.green}14` : `${C.red}12`, border: `2px solid ${ok ? C.green : C.red}`, animation: ok ? "fadeIn .2s" : "sirenFlash .9s ease-in-out 2" }}><div style={{ animation: ok ? "shieldPop .45s ease" : "sirenSpin .35s ease-in-out 3", color: ok ? C.green : C.red }}><Icon name={ok ? "shield" : "siren"} size={44} stroke={2.2} /></div><div style={{ flex: 1 }}><H size={22} color={ok ? C.green : C.red}>{ok ? "Correct" : "Wrong call"}</H><div style={{ marginTop: 4, fontSize: 15, lineHeight: 1.45 }}>{why} {r && <Ref r={r} />}</div>{children}</div></div>; }
function wrapLabel(name, w) { const max = Math.floor((w - 18) / 8.6); const lines = []; let cur = ""; name.split(" ").forEach(word => { if (!cur) cur = word; else if ((cur + " " + word).length <= max) cur += " " + word; else { lines.push(cur); cur = word; } }); if (cur) lines.push(cur); return lines.slice(0, 3); }

/* =====================================================================
   1) MEMORY PALACE — PLANT MAP
   ===================================================================== */
function PlantMap({ s, setS, award }) {
  const [zoneId, setZoneId] = useState(null);
  const [qi, setQi] = useState(0);
  const [pick, setPick] = useState(null);
  const [hits, setHits] = useState(0);
  const [done, setDone] = useState(false);
  const zone = ZONES.find(z => z.id === zoneId);
  const q = zone && zone.qs[qi];
  const opts = useMemo(() => q ? shuffle(q.o.map(([t, ok]) => ({ t, ok: !!ok }))) : [], [zoneId, qi]);

  const enter = id => { setZoneId(id); setQi(0); setPick(null); setHits(0); setDone(false); };
  const choose = i => {
    if (pick !== null) return;
    setPick(i);
    const ok = opts[i].ok;
    if (ok) setHits(h => h + 1);
    award(ok, 10);
  };
  const next = () => {
    if (qi + 1 < zone.qs.length) { setQi(qi + 1); setPick(null); return; }
    const total = zone.qs.length, got = hits;
    const cleared = got === total;
    setS(p => {
      const prev = p.zones[zone.id] || {};
      return { ...p, zones: { ...p.zones, [zone.id]: { best: Math.max(prev.best || 0, got), cleared: prev.cleared || cleared } } };
    });
    if (cleared && !(s.zones[zone.id] && s.zones[zone.id].cleared)) award(true, 30);
    setDone(true);
  };
  useKeys(e => {
    if (!zone || done) return;
    const n = parseInt(e.key, 10);
    if (pick === null && n >= 1 && n <= opts.length) choose(n - 1);
    else if (pick !== null && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); next(); }
  }, [zone, done, pick, opts, qi, hits]);

  const clearedCount = ZONES.filter(z => s.zones[z.id] && s.zones[z.id].cleared).length;

  return (
    <div style={{ display: "grid", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 8 }}>
        <div>
          <H size={34}>Control Loop Map</H>
          <div style={{ color: C.mute, marginTop: 4 }}>Walk the loop. Each zone holds its rules. Clear a zone by going perfect.</div>
        </div>
        <Chip color={C.green}>{clearedCount}/{ZONES.length} zones cleared</Chip>
      </div>

      <Panel style={{ padding: 10 }}>
        <svg viewBox="0 0 1000 610" style={{ width: "100%", display: "block", borderRadius: 10 }} role="img" aria-label="Conceptual map">
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1b222b" strokeWidth="1" /></pattern>
          </defs>
          <rect x="0" y="0" width="1000" height="610" fill="#0f1318" />
          <rect x="0" y="0" width="1000" height="610" fill="url(#grid)" />
          <rect x="18" y="18" width="964" height="580" rx="12" fill="none" stroke="#3a4450" strokeWidth="3" strokeDasharray="10 7" />
          {DECO.map(d => (
            <g key={d.name}>
              <rect x={d.rect[0]} y={d.rect[1]} width={d.rect[2]} height={d.rect[3]} rx="8" fill="#161c23" stroke="#2c3540" strokeWidth="1.5" />
              <text x={d.rect[0] + 10} y={d.rect[1] + 22} fill="#5d6772" fontSize="15" fontFamily="Barlow Condensed, sans-serif" fontWeight="700" letterSpacing="1">{d.name.toUpperCase()}</text>
            </g>
          ))}
          {ZONES.map(z => {
            const [x, y, w, h] = z.rect;
            const cleared = s.zones[z.id] && s.zones[z.id].cleared;
            const active = zoneId === z.id;
            return (
              <g key={z.id} onClick={() => enter(z.id)} style={{ cursor: "pointer" }}>
                <rect x={x} y={y} width={w} height={h} rx="9" fill={z.color} fillOpacity={active ? 0.34 : 0.16} stroke={z.color} strokeWidth={active ? 4 : 2.5}
                  style={{ animation: cleared || active ? "none" : "pulseGlow 2.2s ease-in-out infinite" }} />
                {wrapLabel(z.name, w).map((ln, li) => (
                  <text key={li} x={x + 10} y={y + 24 + li * 19} fill={z.color} fontSize="17" fontFamily="Barlow Condensed, sans-serif" fontWeight="800" letterSpacing=".5">{ln.toUpperCase()}</text>
                ))}
                {cleared && <g transform={`translate(${x + w - 30},${y + h - 30})`}><circle cx="12" cy="12" r="13" fill={C.green} /><path d="M6 12l4 4 8-9" stroke="#111" strokeWidth="3" fill="none" strokeLinecap="round" /></g>}
              </g>
            );
          })}
        </svg>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
          {ZONES.map(z => {
            const cleared = s.zones[z.id] && s.zones[z.id].cleared;
            return <button key={z.id} onClick={() => enter(z.id)} style={{ cursor: "pointer", background: zoneId === z.id ? `${z.color}33` : C.panel2, border: `1px solid ${z.color}88`, color: C.text, borderRadius: 999, padding: "6px 12px", fontSize: 13, fontWeight: 600, display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 8, height: 8, borderRadius: 9, background: cleared ? C.green : z.color }} />{z.name}
            </button>;
          })}
        </div>
      </Panel>

      {!zone && <Panel accent={C.yellow}><div style={{ color: C.mute }}>Tap a glowing zone to enter it. Keys <b style={{ color: C.text }}>1–4</b> answer, <b style={{ color: C.text }}>Enter</b> moves on.</div></Panel>}

      {zone && !done && (
        <Panel accent={zone.color} key={zone.id + qi}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
            <H size={24} color={zone.color}>You are at: {zone.name}</H>
            <span style={{ color: C.mute, fontWeight: 600 }}>{qi + 1} / {zone.qs.length}</span>
          </div>
          <div style={{ marginTop: 6 }}>{zone.chips.map(c => <Chip key={c} color={zone.color}>{c}</Chip>)}</div>
          <div style={{ fontSize: 19, fontWeight: 600, margin: "10px 0 14px", lineHeight: 1.4 }}>{q.q}</div>
          <div style={{ display: "grid", gap: 8 }}>
            {opts.map((o, i) => <OptionBtn key={i} idx={i} label={o.t} disabled={pick !== null} onClick={() => choose(i)}
              state={pick === null ? null : o.ok ? "right" : pick === i ? "wrong" : null} />)}
          </div>
          {pick !== null && (
            <Verdict ok={opts[pick].ok} why={q.why} r={q.ref}>
              <div style={{ marginTop: 12 }}><Btn onClick={next}>{qi + 1 < zone.qs.length ? "Next concept →" : "Finish zone"}</Btn></div>
            </Verdict>
          )}
        </Panel>
      )}

      {zone && done && (
        <Panel accent={hits === zone.qs.length ? C.green : C.orange}>
          <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
            <div style={{ color: hits === zone.qs.length ? C.green : C.orange, animation: "shieldPop .5s" }}><Icon name={hits === zone.qs.length ? "shield" : "bulb"} size={52} /></div>
            <div>
              <H size={26}>{hits === zone.qs.length ? `${zone.name} cleared` : `${hits}/${zone.qs.length} — almost`}</H>
              <div style={{ color: C.mute, marginTop: 4 }}>{hits === zone.qs.length ? "Zone locked in. +30 XP bonus on first clear." : "Run it again to lock it in. Only a perfect run clears a zone."}</div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 14, flexWrap: "wrap" }}>
            <Btn onClick={() => enter(zone.id)} ghost>Run again</Btn>
            <Btn onClick={() => { const nz = ZONES.find(z => !(s.zones[z.id] && s.zones[z.id].cleared) && z.id !== zone.id); if (nz) enter(nz.id); else setZoneId(null); }}>Next zone →</Btn>
          </div>
        </Panel>
      )}
    </div>
  );
}

/* =====================================================================
   2) PERMIT PANIC — timed sorting
   ===================================================================== */
function pickPanic(level, last) {
  const r = Math.random();
  const bin = level < 2 ? (r < 0.6 ? "analog" : "discrete") : (r < 0.45 ? "analog" : r < 0.7 ? "discrete" : "power");
  const pool = PANIC.filter(i => i.bin === bin && i.t !== last);
  return pool[Math.floor(Math.random() * pool.length)];
}
const panicDuration = lvl => Math.max(2600, 7000 - (lvl - 1) * 650);

function PermitPanic({ s, setS, award }) {
  const [phase, setPhase] = useState("intro");
  const [g, setG] = useState(null);
  const [banner, setBanner] = useState(null);
  const timer = useRef(null);
  const [overBin, setOverBin] = useState(null);

  const start = () => {
    const item = pickPanic(1, null);
    setG({ level: 1, score: 0, strikes: 0, inLevel: 0, item, uid: Date.now(), fb: null, missed: [], sorted: 0 });
    setPhase("play"); setBanner(null);
  };

  const gRef = useRef(null);
  gRef.current = g;

  const answer = useCallback(choice => {
    const prev = gRef.current;
    if (!prev || prev.fb) return;
    clearTimeout(timer.current);
    const ok = choice === prev.item.bin;
    award(ok, ok ? 4 + prev.level : 0);
    let { level, inLevel, strikes, score, missed, sorted } = prev;
    if (ok) { score += 10 * level; inLevel += 1; sorted += 1; }
    else { strikes += 1; missed = [...missed, { ...prev.item, choice }]; }
    if (inLevel >= 5) {
      level += 1; inLevel = 0;
      setBanner(level === 2 ? "LEVEL 2 — NEW BIN UNLOCKED: LINE POWER" : `LEVEL ${level} — SPEED UP`);
    }
    const nextG = { ...prev, level, inLevel, strikes, score, missed, sorted, fb: { ok, choice, timeout: choice === "__timeout" } };
    gRef.current = nextG;
    setG(nextG);
  }, [award]);

  useEffect(() => {
    if (!g || !g.fb || phase !== "play") return;
    const t = setTimeout(() => {
      const prev = gRef.current;
      if (prev.strikes >= 3) {
        setPhase("over");
        setS(p => ({ ...p, panicBest: Math.max(p.panicBest || 0, prev.score), panicBestLevel: Math.max(p.panicBestLevel || 0, prev.level) }));
      } else {
        setG({ ...prev, item: pickPanic(prev.level, prev.item.t), uid: Date.now(), fb: null });
      }
    }, g.fb.ok ? 650 : 1700);
    return () => clearTimeout(t);
  }, [g && g.fb, phase]);

  useEffect(() => { if (!banner) return; const t = setTimeout(() => setBanner(null), 2200); return () => clearTimeout(t); }, [banner]);

  useEffect(() => {
    if (phase !== "play" || !g || g.fb) return;
    timer.current = setTimeout(() => answer("__timeout"), panicDuration(g.level));
    return () => clearTimeout(timer.current);
  }, [g && g.uid, g && g.fb, phase]);

  useKeys(e => {
    if (phase !== "play" || !g || g.fb) return;
    const b = BINS.find(b => b.key === e.key && (b.id !== "power" || g.level >= 2));
    if (b) answer(b.id);
  }, [phase, g, answer]);

  if (phase === "intro") return (
    <div style={{ display: "grid", gap: 16 }}>
      <H size={34}>Signal Panic</H>
      <Panel accent={C.yellow}>
        <div style={{ fontSize: 17, lineHeight: 1.5 }}>Signals drop from the top. Sort each one before it hits the floor.</div>
        <div style={{ display: "grid", gap: 8, marginTop: 14 }}>
          {BINS.map(b => <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontFamily: HEAD, fontWeight: 800, background: b.color, color: "#111", borderRadius: 6, width: 26, height: 26, display: "grid", placeItems: "center" }}>{b.key}</span>
            <span style={{ fontWeight: 700, color: b.color }}>{b.label}</span>
            {b.id === "power" && <span style={{ color: C.mute, fontSize: 13 }}>unlocks at level 2</span>}
          </div>)}
        </div>
        <div style={{ color: C.mute, marginTop: 14 }}>Click a bin, drag the card, or press 1/2/3. Every 5 correct = faster. 3 strikes and you're out.</div>
        <div style={{ display: "flex", gap: 12, alignItems: "center", marginTop: 16, flexWrap: "wrap" }}>
          <Btn big onClick={start}>Start sorting</Btn>
          <span style={{ color: C.mute }}>Best: <b style={{ color: C.yellow }}>{s.panicBest || 0}</b>{s.panicBestLevel ? ` (level ${s.panicBestLevel})` : ""}</span>
        </div>
      </Panel>
    </div>
  );

  if (phase === "over") return (
    <div style={{ display: "grid", gap: 16 }}>
      <H size={34}>Faulted Out</H>
      <Panel accent={C.red}>
        <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
          <Stat label="Score" v={g.score} c={C.yellow} />
          <Stat label="Level reached" v={g.level} c={C.blue} />
          <Stat label="Sorted right" v={g.sorted} c={C.green} />
          <Stat label="Best" v={Math.max(s.panicBest || 0, g.score)} c={C.orange} />
        </div>
        {g.missed.length > 0 && <div style={{ marginTop: 18 }}>
          <H size={20} color={C.mute}>What got you — learn these</H>
          <div style={{ display: "grid", gap: 8, marginTop: 8 }}>
            {g.missed.map((m, i) => { const b = BINS.find(b => b.id === m.bin); return (
              <div key={i} style={{ background: C.panel2, borderRadius: 10, padding: "10px 12px", borderLeft: `4px solid ${b.color}` }}>
                <div style={{ fontWeight: 600 }}>{m.t}</div>
                <div style={{ fontSize: 14, color: C.mute, marginTop: 2 }}>→ <b style={{ color: b.color }}>{b.label}</b>. {m.why}{m.choice === "__timeout" ? " (timed out)" : ""}</div>
              </div>); })}
          </div>
        </div>}
        <div style={{ marginTop: 16 }}><Btn big onClick={start}>Run it back</Btn></div>
      </Panel>
    </div>
  );

  const dur = panicDuration(g.level);
  const bins = BINS.filter(b => b.id !== "power" || g.level >= 2);
  const fb = g.fb;
  const rightBin = BINS.find(b => b.id === g.item.bin);
  return (
    <div style={{ display: "grid", gap: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
        <H size={30}>Signal Panic</H>
        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          <span style={{ fontFamily: HEAD, fontSize: 22, fontWeight: 800, color: C.yellow }}>{g.score}</span>
          <span style={{ fontFamily: HEAD, fontSize: 18, fontWeight: 700, color: C.blue }}>LVL {g.level}</span>
          <span style={{ display: "flex", gap: 4 }}>{[0, 1, 2].map(i => <span key={i} style={{ color: i < g.strikes ? C.red : "#3a4450" }}><Icon name="siren" size={20} /></span>)}</span>
        </div>
      </div>
      <div style={{ position: "relative", height: 320, borderRadius: 14, overflow: "hidden", border: `1px solid ${C.line}`,
        background: fb && !fb.ok ? undefined : "linear-gradient(#10151b, #0c1014)", animation: fb && !fb.ok ? "redWash .5s ease-in-out 3" : "none" }}>
        <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, height: 10, background: stripe(), animation: "stripes 1s linear infinite" }} />
        <div style={{ position: "absolute", left: 0, top: 0, height: 5, background: C.yellow, animation: fb ? "none" : `drain ${dur}ms linear forwards`, width: fb ? 0 : undefined }} key={"bar" + g.uid} />
        {banner && <div style={{ position: "absolute", top: 12, left: "50%", transform: "translateX(-50%)", background: C.yellow, color: "#111", fontFamily: HEAD, fontWeight: 800, padding: "6px 14px", borderRadius: 8, fontSize: 18, zIndex: 3, whiteSpace: "nowrap", animation: "levelUp .5s" }}>{banner}</div>}
        {!fb && (
          <div key={g.uid} draggable onDragStart={e => { e.dataTransfer.setData("text/plain", "card"); }}
            style={{ position: "absolute", top: 18, left: "50%", width: "min(86%, 440px)", animation: `fall ${dur}ms linear forwards`,
              background: "#f4f1e8", color: "#111", borderRadius: 12, padding: "16px 18px", boxShadow: "0 10px 30px rgba(0,0,0,.5)", cursor: "grab", borderLeft: `8px solid ${C.yellow}` }}>
            <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 2, color: "#7a6a2a" }}>SIGNAL TRACE</div>
            <div style={{ fontSize: 19, fontWeight: 700, marginTop: 4, lineHeight: 1.3 }}>{g.item.t}</div>
          </div>
        )}
        {fb && (
          <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center", padding: 20, textAlign: "center" }}>
            <div style={{ animation: fb.ok ? "shieldPop .35s" : "shake .45s" }}>
              <div style={{ color: fb.ok ? C.green : C.red, display: "flex", justifyContent: "center" }}><Icon name={fb.ok ? "shield" : "siren"} size={62} /></div>
              <H size={28} color={fb.ok ? C.green : C.red} style={{ marginTop: 6 }}>{fb.ok ? "Sorted" : fb.timeout ? "Too slow" : "Wrong bin"}</H>
              {!fb.ok && <div style={{ marginTop: 6, fontSize: 16, maxWidth: 440 }}><b>{g.item.t}</b> → <b style={{ color: rightBin.color }}>{rightBin.label}</b><div style={{ color: C.mute, marginTop: 4 }}>{g.item.why}</div></div>}
            </div>
          </div>
        )}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: `repeat(${bins.length}, 1fr)`, gap: 10 }}>
        {bins.map(b => {
          const hi = fb && b.id === g.item.bin;
          return (
            <button key={b.id} onClick={() => answer(b.id)}
              onDragOver={e => { e.preventDefault(); setOverBin(b.id); }} onDragLeave={() => setOverBin(null)}
              onDrop={e => { e.preventDefault(); setOverBin(null); answer(b.id); }}
              style={{ cursor: "pointer", minHeight: 92, borderRadius: 14, border: `3px ${overBin === b.id ? "solid" : "dashed"} ${b.color}`,
                background: hi ? `${b.color}40` : overBin === b.id ? `${b.color}30` : `${b.color}12`, color: b.color, fontFamily: HEAD, fontWeight: 800, fontSize: 19, letterSpacing: 0.5, padding: 8,
                animation: b.id === "power" && banner && g.level === 2 ? "tick .5s 3" : "none" }}>
              <div style={{ fontSize: 13, opacity: 0.8 }}>[{b.key}]</div>{b.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function Stat({ label, v, c }) {
  return <div><div style={{ fontFamily: HEAD, fontSize: 40, fontWeight: 800, color: c, lineHeight: 1 }}>{v}</div><div style={{ color: C.mute, fontSize: 13, fontWeight: 600, textTransform: "uppercase", letterSpacing: 1, marginTop: 2 }}>{label}</div></div>;
}

/* =====================================================================
   3) SCENARIO SIMULATOR
   ===================================================================== */
function Simulator({ s, setS, award }) {
  const [sid, setSid] = useState(null);
  const [step, setStep] = useState(0);
  const [pick, setPick] = useState(null);
  const [misses, setMisses] = useState(0);
  const [missedHere, setMissedHere] = useState(false);
  const [finished, setFinished] = useState(false);
  const sc = SCENARIOS.find(x => x.id === sid);
  const st = sc && sc.steps[step];
  const opts = useMemo(() => st ? shuffle(st.o) : [], [sid, step]);

  const open = id => { setSid(id); setStep(0); setPick(null); setMisses(0); setMissedHere(false); setFinished(false); };
  const choose = i => {
    if (pick !== null) return;
    setPick(i);
    const ok = !!opts[i].ok;
    award(ok, ok ? (missedHere ? 5 : 15) : 0);
    if (!ok) { setMisses(m => m + 1); setMissedHere(true); }
  };
  const retry = () => setPick(null);
  const advance = () => {
    if (step + 1 < sc.steps.length) { setStep(step + 1); setPick(null); setMissedHere(false); return; }
    const perfect = misses === 0;
    const prev = s.scen[sc.id];
    setS(p => ({ ...p, scen: { ...p.scen, [sc.id]: { done: true, perfect: (prev && prev.perfect) || perfect } } }));
    award(true, 25 + (perfect ? 25 : 0));
    setFinished(true);
  };
  useKeys(e => {
    if (!sc || finished) return;
    const n = parseInt(e.key, 10);
    if (pick === null && n >= 1 && n <= opts.length) choose(n - 1);
    else if (pick !== null && e.key === "Enter") { opts[pick].ok ? advance() : retry(); }
  }, [sc, finished, pick, opts, step, misses, missedHere]);

  if (!sc) return (
    <div style={{ display: "grid", gap: 16 }}>
      <div>
        <H size={34}>Scenario Simulator</H>
        <div style={{ color: C.mute, marginTop: 4 }}>Follow the evidence. Wrong calls play out. Then you get the rule and a retry.</div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 12 }}>
        {SCENARIOS.map(x => {
          const r = s.scen[x.id];
          return (
            <button key={x.id} onClick={() => open(x.id)} style={{ cursor: "pointer", textAlign: "left", background: C.panel, border: `1px solid ${C.line}`, borderTop: `4px solid ${x.color}`, borderRadius: 14, padding: 16, color: C.text }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <Chip color={x.color}>{x.tag}</Chip>
                {r && <span style={{ color: r.perfect ? C.green : C.yellow, display: "flex", alignItems: "center", gap: 4, fontSize: 12, fontWeight: 700 }}><Icon name={r.perfect ? "star" : "check"} size={16} />{r.perfect ? "PERFECT" : "DONE"}</span>}
              </div>
              <H size={24} style={{ marginTop: 4 }}>{x.title}</H>
              <div style={{ color: C.mute, fontSize: 14, marginTop: 4 }}>You are: {x.role} · {x.steps.length} decision{x.steps.length > 1 ? "s" : ""}</div>
            </button>
          );
        })}
      </div>
    </div>
  );

  if (finished) return (
    <div style={{ display: "grid", gap: 16 }}>
      <Panel accent={misses === 0 ? C.green : C.yellow}>
        <div style={{ display: "flex", gap: 14, alignItems: "center" }}>
          <div style={{ color: misses === 0 ? C.green : C.yellow, animation: "shieldPop .5s" }}><Icon name={misses === 0 ? "star" : "shield"} size={54} /></div>
          <div>
            <H size={28}>{misses === 0 ? "Clean troubleshoot." : "Scenario survived"}</H>
            <div style={{ color: C.mute, marginTop: 4 }}>{misses === 0 ? "Perfect — +50 XP." : `${misses} wrong call${misses > 1 ? "s" : ""} along the way. Run it again for a perfect.`}</div>
          </div>
        </div>
        <div style={{ marginTop: 14, display: "grid", gap: 6 }}>
          {sc.steps.map((x, i) => <div key={i} style={{ fontSize: 14, color: C.mute }}><b style={{ color: C.text }}>Rule {i + 1}:</b> {x.why} <Ref r={x.ref} /></div>)}
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 16, flexWrap: "wrap" }}>
          <Btn ghost onClick={() => open(sc.id)}>Replay</Btn>
          <Btn onClick={() => setSid(null)}>All scenarios</Btn>
        </div>
      </Panel>
    </div>
  );

  const failed = pick !== null && !opts[pick].ok;
  return (
    <div style={{ display: "grid", gap: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <button onClick={() => setSid(null)} style={{ background: "none", border: "none", color: C.mute, cursor: "pointer", fontWeight: 600 }}>← Scenarios</button>
        <div style={{ display: "flex", gap: 6 }}>{sc.steps.map((_, i) => <span key={i} style={{ width: 30, height: 6, borderRadius: 4, background: i < step ? C.green : i === step ? sc.color : "#2a323d" }} />)}</div>
      </div>
      <Panel accent={sc.color} key={sid + step} style={{ position: "relative", overflow: "hidden" }}>
        <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 2, color: sc.color }}>RADIO · {sc.role.toUpperCase()}</div>
        <H size={28} style={{ marginTop: 4 }}>{sc.title}</H>
        <div style={{ fontSize: 19, lineHeight: 1.45, margin: "12px 0 16px", fontWeight: 500 }}>{st.text}</div>
        <div style={{ display: "grid", gap: 8 }}>
          {opts.map((o, i) => <OptionBtn key={i} idx={i} label={o.t} disabled={pick !== null}
            onClick={() => choose(i)} state={pick === null ? null : pick === i ? (o.ok ? "right" : "wrong") : null} />)}
        </div>
        {pick !== null && !failed && (
          <Verdict ok why={st.why} r={st.ref}>
            <div style={{ marginTop: 12 }}><Btn onClick={advance}>{step + 1 < sc.steps.length ? "Next decision →" : "Debrief"}</Btn></div>
          </Verdict>
        )}
        {failed && (
          <div style={{ marginTop: 14, borderRadius: 14, padding: 18, background: "#1a0b0b", animation: "sirenFlash .8s ease-in-out 3" }}>
            <div style={{ display: "flex", gap: 14, alignItems: "flex-start" }}>
              <div style={{ color: C.red, animation: "sirenSpin .3s ease-in-out 5" }}><Icon name="siren" size={48} /></div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 2, color: C.red }}>FAULT · SIMULATED</div>
                <div style={{ fontSize: 17, marginTop: 4, lineHeight: 1.45 }}>{opts[pick].fail || "That call ignored the evidence."}</div>
                <div style={{ marginTop: 10, padding: "10px 12px", background: "rgba(255,255,255,.04)", borderRadius: 10, fontSize: 15 }}>
                  <b style={{ color: C.yellow }}>The rule:</b> {st.why} <Ref r={st.ref} />
                </div>
                <div style={{ marginTop: 12 }}><Btn color={C.red} onClick={retry}>Rewind — make the call again</Btn></div>
              </div>
            </div>
          </div>
        )}
      </Panel>
    </div>
  );
}

/* =====================================================================
   4) SAFETY VAULT — cloze SRS (1 / 3 / 7 days)
   ===================================================================== */
function Vault({ s, setS, award }) {
  const now = Date.now();
  const due = CARDS.filter(c => { const v = s.vault[c.id]; return !v || v.due <= now; });
  const mastered = CARDS.filter(c => s.vault[c.id] && s.vault[c.id].lvl >= 3).length;
  const [queue, setQueue] = useState(null);
  const [mode, setMode] = useState("due");
  const [i, setI] = useState(0);
  const [val, setVal] = useState("");
  const [state, setState] = useState("ask"); 
  const [hint, setHint] = useState(false);
  const [missed, setMissed] = useState({});
  const [tally, setTally] = useState({ right: 0, total: 0 });
  const inputRef = useRef(null);

  const start = m => {
    const pool = m === "due" ? shuffle(due).slice(0, 8) : shuffle(CARDS).slice(0, 8);
    setMode(m); setQueue(pool); setI(0); setVal(""); setState("ask"); setHint(false); setMissed({}); setTally({ right: 0, total: 0 });
  };
  const card = queue && queue[i];
  useEffect(() => { if (card && inputRef.current) inputRef.current.focus(); }, [i, queue, state]);

  const schedule = (id, ok) => {
    if (mode !== "due") return;
    setS(p => {
      const v = p.vault[id] || { lvl: 0 };
      const lvl = ok ? Math.min(3, v.lvl + 1) : 1;
      return { ...p, vault: { ...p.vault, [id]: { lvl, due: Date.now() + INTERVALS[lvl] * DAY } } };
    });
  };

  const submit = () => {
    if (!card || !val.trim()) return;
    const ok = card.ans.map(norm).includes(norm(val));
    if (ok) {
      const first = !missed[card.id];
      setState("right");
      award(true, first ? (mode === "due" ? 10 : 5) : 3);
      if (first) { schedule(card.id, true); setTally(t => ({ right: t.right + 1, total: t.total + 1 })); }
    } else {
      setState("wrong"); setHint(true);
      if (!missed[card.id]) {
        setMissed(m => ({ ...m, [card.id]: true }));
        schedule(card.id, false);
        setTally(t => ({ ...t, total: t.total + 1 }));
        setQueue(q => [...q, card]); 
      }
    }
  };
  const reveal = () => {
    setState("reveal");
    if (!missed[card.id]) {
      setMissed(m => ({ ...m, [card.id]: true }));
      schedule(card.id, false);
      setTally(t => ({ ...t, total: t.total + 1 }));
      setQueue(q => [...q, card]);
    }
  };
  const next = () => { setI(i + 1); setVal(""); setState("ask"); setHint(false); };

  const lvlCounts = [0, 1, 2, 3].map(l => CARDS.filter(c => ((s.vault[c.id] && s.vault[c.id].lvl) || 0) === l).length);
  const nextDue = CARDS.map(c => s.vault[c.id]).filter(Boolean).map(v => v.due).filter(d => d > now).sort((a, b) => a - b)[0];

  if (!queue || i >= queue.length) {
    const finished = queue && i >= queue.length;
    return (
      <div style={{ display: "grid", gap: 16 }}>
        <div>
          <H size={34}>Fundamentals Vault</H>
          <div style={{ color: C.mute, marginTop: 4 }}>Fill-in-the-blank from your reference material. Right = next review in 1 → 3 → 7 days.</div>
        </div>
        {finished && <Panel accent={C.green}>
          <H size={24} color={C.green}>Vault session closed</H>
          <div style={{ marginTop: 6, fontSize: 17 }}>{tally.right} / {tally.total} on first try{mode !== "due" ? " (practice — schedule unchanged)" : ""}.</div>
        </Panel>}
        <Panel accent={C.yellow}>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
            <Stat label="Due now" v={due.length} c={C.yellow} />
            <Stat label="Mastered (7-day)" v={mastered} c={C.green} />
            <Stat label="Total cards" v={CARDS.length} c={C.blue} />
          </div>
          <div style={{ display: "flex", height: 14, borderRadius: 7, overflow: "hidden", marginTop: 16, background: "#222a33" }}>
            {[["#3a4450", "New"], [C.orange, "1-day"], [C.yellow, "3-day"], [C.green, "7-day"]].map(([col], l) => lvlCounts[l] > 0 && <div key={l} style={{ width: `${lvlCounts[l] / CARDS.length * 100}%`, background: col, transition: "width .4s" }} />)}
          </div>
          <div style={{ display: "flex", gap: 14, marginTop: 8, fontSize: 13, color: C.mute, flexWrap: "wrap" }}>
            {[["#3a4450", "New"], [C.orange, "1-day"], [C.yellow, "3-day"], [C.green, "7-day"]].map(([col, lab], l) => <span key={l} style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 10, height: 10, borderRadius: 3, background: col }} />{lab}: {lvlCounts[l]}</span>)}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 18, flexWrap: "wrap", alignItems: "center" }}>
            <Btn big disabled={!due.length} onClick={() => start("due")}>{due.length ? `Open vault (${Math.min(8, due.length)} cards)` : "Nothing due"}</Btn>
            <Btn ghost onClick={() => start("practice")}>Practice 8 random</Btn>
            {!due.length && nextDue && <span style={{ color: C.mute, fontSize: 14 }}>Next card due {new Date(nextDue).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</span>}
          </div>
        </Panel>
      </div>
    );
  }

  const correctShow = state === "right" || state === "reveal";
  return (
    <div style={{ display: "grid", gap: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <H size={30}>Fundamentals Vault</H>
        <span style={{ color: C.mute, fontWeight: 600 }}>{i + 1} / {queue.length}{mode !== "due" ? " · practice" : ""}</span>
      </div>
      <div style={{ height: 6, background: "#222a33", borderRadius: 4, overflow: "hidden" }}><div style={{ width: `${i / queue.length * 100}%`, height: "100%", background: C.yellow, transition: "width .3s" }} /></div>
      <Panel accent={state === "right" ? C.green : state === "wrong" ? C.orange : C.yellow} key={card.id + i}>
        <Chip color={C.blue}>{card.topic}</Chip>
        <div style={{ fontSize: 24, lineHeight: 1.6, fontWeight: 600, marginTop: 8 }}>
          {card.pre}{" "}
          {correctShow
            ? <span style={{ color: state === "right" ? C.green : C.yellow, borderBottom: `3px solid ${state === "right" ? C.green : C.yellow}`, padding: "0 4px", animation: "shieldPop .35s", display: "inline-block" }}>{card.show}</span>
            : <input ref={inputRef} value={val} onChange={e => { setVal(e.target.value); if (state === "wrong") setState("ask"); }} onKeyDown={e => { if (e.key === "Enter") submit(); }}
                placeholder="_____" aria-label="Answer"
                style={{ width: Math.max(110, Math.min(260, (val.length + 3) * 15)), background: "#0f1318", border: "none", borderBottom: `3px solid ${state === "wrong" ? C.orange : C.yellow}`, color: C.text, fontSize: 22, fontWeight: 700, padding: "2px 6px", outline: "none", animation: state === "wrong" ? "shake .35s" : "none" }} />}
          {" "}{card.post}
        </div>

        {hint && !correctShow && (
          <div style={{ marginTop: 14, padding: "12px 14px", borderRadius: 10, background: `${C.orange}14`, border: `1px solid ${C.orange}66`, display: "flex", gap: 10 }}>
            <span style={{ color: C.orange }}><Icon name="bulb" /></span>
            <div style={{ fontSize: 15, lineHeight: 1.45 }}>{state === "wrong" && <b style={{ color: C.orange }}>Not quite. </b>}{card.hint} <Ref r={card.ref} /></div>
          </div>
        )}
        {state === "right" && <Verdict ok why={card.hint} r={card.ref} />}
        {state === "reveal" && <div style={{ marginTop: 14, color: C.mute, fontSize: 15 }}>{card.hint} <Ref r={card.ref} /> — it'll come back at the end of this session.</div>}

        <div style={{ display: "flex", gap: 10, marginTop: 16, flexWrap: "wrap" }}>
          {!correctShow && <>
            <Btn onClick={submit} disabled={!val.trim()}>Check</Btn>
            {!hint && <Btn ghost color={C.orange} onClick={() => setHint(true)}>Hint</Btn>}
            {(hint || state === "wrong") && <Btn ghost color={C.mute} onClick={reveal}>Show answer</Btn>}
          </>}
          {correctShow && <Btn onClick={next}>Next →</Btn>}
        </div>
      </Panel>
    </div>
  );
}

/* =====================================================================
   5) BOSS FIGHT — 60-second Quick Memory blitz
   ===================================================================== */
function Boss({ s, setS, award }) {
  const [phase, setPhase] = useState("intro");
  const [deck, setDeck] = useState([]);
  const [idx, setIdx] = useState(0);
  const [time, setTime] = useState(60);
  const [score, setScore] = useState(0);
  const [wrong, setWrong] = useState(0);
  const [combo, setCombo] = useState(0);
  const [flash, setFlash] = useState(null);
  const [misses, setMisses] = useState([]);
  const [result, setResult] = useState(null);
  const [initials, setInitials] = useState("YOU");
  const endRef = useRef(false);

  const makeQ = q => ({ ...q, opts: shuffle([q.a, ...q.d.slice(0, 3)]) });
  const start = () => {
    setDeck(shuffle(BOSS).map(makeQ)); setIdx(0); setTime(60); setScore(0); setWrong(0); setCombo(0); setMisses([]); setFlash(null); setResult(null);
    endRef.current = false; setPhase("play");
  };

  useEffect(() => {
    if (phase !== "play") return;
    const t = setInterval(() => setTime(x => x - 1), 1000);
    return () => clearInterval(t);
  }, [phase]);
  useEffect(() => { if (phase === "play" && time <= 10 && time > 0) SFX.tick(); }, [time]);
  useEffect(() => {
    if (phase === "play" && time <= 0 && !endRef.current) {
      endRef.current = true;
      const acc = score + wrong ? score / (score + wrong) : 0;
      const cert = score >= 12 && acc >= 0.85;
      const newCert = cert && !s.certified;
      setResult({ score, wrong, acc, cert, newCert });
      setS(p => ({ ...p, bossBest: Math.max(p.bossBest || 0, score), certified: p.certified || cert }));
      if (newCert) award(true, 100);
      setPhase("over");
    }
  }, [time, phase]);

  const q = deck[idx % Math.max(1, deck.length)];
  const answer = opt => {
    if (phase !== "play" || !q) return;
    const ok = opt === q.a;
    award(ok, ok ? 5 + Math.min(combo, 5) : 0);
    if (ok) { setScore(x => x + 1); setCombo(c => c + 1); }
    else { setWrong(x => x + 1); setCombo(0); setTime(t => Math.max(0, t - 3)); setMisses(m => [...m, q]); }
    setFlash({ ok, k: Date.now() });
    const ni = idx + 1;
    if (ni % deck.length === 0) setDeck(shuffle(BOSS).map(makeQ));
    setIdx(ni);
  };
  useKeys(e => { if (phase === "play" && q) { const n = parseInt(e.key, 10); if (n >= 1 && n <= 4) answer(q.opts[n - 1]); } }, [phase, q, idx, combo]);

  const saveScore = () => {
    setS(p => ({ ...p, board: [...(p.board || []), { n: (initials || "YOU").toUpperCase().slice(0, 3), sc: result.score, acc: Math.round(result.acc * 100), d: Date.now() }].sort((a, b) => b.sc - a.sc || b.acc - a.acc).slice(0, 5) }));
    setResult(r => ({ ...r, saved: true }));
  };

  const Board = () => (
    <div style={{ marginTop: 6 }}>
      <H size={20} color={C.mute}>Local leaderboard</H>
      {(s.board || []).length === 0 ? <div style={{ color: C.dim, marginTop: 6 }}>No runs saved yet.</div> :
        <div style={{ display: "grid", gap: 6, marginTop: 8 }}>{s.board.map((b, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 12, background: C.panel2, borderRadius: 10, padding: "8px 12px" }}>
            <span style={{ fontFamily: HEAD, fontWeight: 800, fontSize: 20, width: 24, color: i === 0 ? C.yellow : C.mute }}>{i + 1}</span>
            <span style={{ fontFamily: HEAD, fontWeight: 800, fontSize: 20, letterSpacing: 2, flex: 1 }}>{b.n}</span>
            <span style={{ color: C.mute, fontSize: 13 }}>{b.acc}% · {new Date(b.d).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span>
            <span style={{ fontFamily: HEAD, fontWeight: 800, fontSize: 22, color: C.yellow, width: 36, textAlign: "right" }}>{b.sc}</span>
          </div>))}</div>}
    </div>
  );

  const Badge = ({ big }) => (
    <div style={{ display: "inline-flex", alignItems: "center", gap: 10, padding: big ? "12px 18px" : "8px 12px", borderRadius: 12, background: stripe(C.yellow, "#1a1a1a"), animation: big ? "levelUp .7s" : "none" }}>
      <div style={{ background: "#111", borderRadius: 8, padding: "6px 12px", display: "flex", alignItems: "center", gap: 8, color: C.yellow }}>
        <Icon name="shield" size={big ? 30 : 20} /><span style={{ fontFamily: HEAD, fontWeight: 800, fontSize: big ? 24 : 16, letterSpacing: 2 }}>I&C BASICS CERTIFIED</span>
      </div>
    </div>
  );

  if (phase === "intro") return (
    <div style={{ display: "grid", gap: 16 }}>
      <H size={34}>Boss Fight: Rapid Fire</H>
      <Panel accent={C.red}>
        <div style={{ fontSize: 17, lineHeight: 1.5 }}>60 seconds. Answer as many concepts as you can. Wrong answers cost <b style={{ color: C.red }}>3 seconds</b>. Combos add XP.</div>
        <div style={{ color: C.mute, marginTop: 8 }}>Certification: <b style={{ color: C.text }}>12+ correct</b> at <b style={{ color: C.text }}>85%+ accuracy</b>. Keys 1–4.</div>
        {s.certified && <div style={{ marginTop: 14 }}><Badge /></div>}
        <div style={{ display: "flex", gap: 12, alignItems: "center", marginTop: 16 }}>
          <Btn big color={C.red} onClick={start}>Start the clock</Btn>
          <span style={{ color: C.mute }}>Best: <b style={{ color: C.yellow }}>{s.bossBest || 0}</b></span>
        </div>
      </Panel>
      <Panel><Board /></Panel>
    </div>
  );

  if (phase === "over") return (
    <div style={{ display: "grid", gap: 16 }}>
      <H size={34}>Time</H>
      <Panel accent={result.cert ? C.green : C.orange}>
        {result.cert && <div style={{ marginBottom: 16 }}><Badge big /></div>}
        <div style={{ display: "flex", gap: 24, flexWrap: "wrap" }}>
          <Stat label="Correct" v={result.score} c={C.green} />
          <Stat label="Wrong" v={result.wrong} c={C.red} />
          <Stat label="Accuracy" v={`${Math.round(result.acc * 100)}%`} c={C.blue} />
        </div>
        {!result.cert && <div style={{ marginTop: 12, color: C.mute }}>Certification needs 12+ correct at 85%+. {result.score < 12 ? `${12 - result.score} more correct.` : "Tighten accuracy."}</div>}
        {result.newCert && <div style={{ marginTop: 10, color: C.green, fontWeight: 700 }}>Badge unlocked. +100 XP.</div>}
        {!result.saved ? (
          <div style={{ display: "flex", gap: 10, marginTop: 16, alignItems: "center", flexWrap: "wrap" }}>
            <input value={initials} maxLength={3} onChange={e => setInitials(e.target.value.toUpperCase())} aria-label="Initials"
              style={{ width: 80, background: "#0f1318", border: `2px solid ${C.line}`, borderRadius: 8, color: C.text, fontFamily: HEAD, fontSize: 22, fontWeight: 800, letterSpacing: 3, textAlign: "center", padding: 6 }} />
            <Btn onClick={saveScore}>Save to board</Btn>
            <Btn ghost color={C.red} onClick={start}>Rematch</Btn>
          </div>
        ) : <div style={{ marginTop: 16 }}><Btn color={C.red} onClick={start}>Rematch</Btn></div>}
        {misses.length > 0 && <div style={{ marginTop: 18 }}>
          <H size={20} color={C.mute}>Review your misses</H>
          <div style={{ display: "grid", gap: 6, marginTop: 8 }}>{[...new Map(misses.map(m => [m.q, m])).values()].map((m, i) => (
            <div key={i} style={{ background: C.panel2, borderRadius: 10, padding: "8px 12px", fontSize: 15 }}><b>{m.q.replace(" = ?", "").replace(" ?", "")}</b> → <span style={{ color: C.green }}>{m.a}</span></div>))}</div>
        </div>}
      </Panel>
      <Panel><Board /></Panel>
    </div>
  );

  const pct = Math.max(0, time) / 60;
  return (
    <div style={{ display: "grid", gap: 14 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, color: time <= 10 ? C.red : C.yellow, animation: time <= 10 ? "tick 1s infinite" : "none" }}>
          <Icon name="clock" size={28} /><span style={{ fontFamily: HEAD, fontWeight: 800, fontSize: 40 }}>{Math.max(0, time)}</span>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontFamily: HEAD, fontWeight: 800, fontSize: 32, color: C.green }}>{score}</div>
          {combo >= 3 && <div style={{ fontFamily: HEAD, fontWeight: 800, color: C.orange, animation: "tick .4s" }} key={combo}>COMBO x{combo}</div>}
        </div>
      </div>
      <div style={{ height: 10, background: "#222a33", borderRadius: 6, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${pct * 100}%`, background: time <= 10 ? C.red : C.yellow, transition: "width 1s linear" }} />
      </div>
      <Panel accent={C.red} style={{ position: "relative", animation: flash && !flash.ok ? "shake .35s" : "none" }} key={flash ? flash.k : "p"}>
        {flash && <div style={{ position: "absolute", top: 12, right: 14, color: flash.ok ? C.green : C.red, fontFamily: HEAD, fontWeight: 800, fontSize: 18, animation: "floatUp .8s forwards" }}>{flash.ok ? "+1" : "−3s"}</div>}
        <H size={38} style={{ textAlign: "center", margin: "10px 0 18px", textTransform: "none" }}>{q.q}</H>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 10 }}>
          {q.opts.map((o, i) => <OptionBtn key={o + idx} idx={i} label={o} onClick={() => answer(o)} />)}
        </div>
      </Panel>
    </div>
  );
}

/* =====================================================================
   QUICK SHEET MODAL
   ===================================================================== */
function QuickSheet({ onClose }) {
  useKeys(e => { if (e.key === "Escape") onClose(); }, [onClose]);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.7)", zIndex: 50, display: "grid", placeItems: "center", padding: 16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.panel, borderRadius: 16, border: `1px solid ${C.line}`, maxWidth: 720, width: "100%", maxHeight: "86vh", overflow: "auto", animation: "fadeIn .2s" }}>
        <div style={{ height: 10, background: stripe(), borderRadius: "16px 16px 0 0" }} />
        <div style={{ padding: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <H size={28}>Quick Memory Sheet</H>
            <button onClick={onClose} aria-label="Close" style={{ background: "none", border: "none", color: C.mute, cursor: "pointer" }}><Icon name="x" size={26} /></button>
          </div>
          <div style={{ display: "grid", gap: 6, marginTop: 14 }}>
            {QUICK.map((r, i) => (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "minmax(120px, 38%) 1fr auto", gap: 10, alignItems: "baseline", background: i % 2 ? "transparent" : C.panel2, borderRadius: 8, padding: "8px 10px" }}>
                <b style={{ fontSize: 14 }}>{r.topic}</b><span style={{ fontSize: 14, color: C.text }}>{r.rule}</span><Ref r={r.ref} />
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* =====================================================================
   APP SHELL
   ===================================================================== */
const TABS = [
  { id: "map", label: "Control Loop Map", icon: "map" },
  { id: "panic", label: "Signal Panic", icon: "bolt" },
  { id: "sim", label: "Simulator", icon: "tree" },
  { id: "vault", label: "Fundamentals Vault", icon: "vault" },
  { id: "boss", label: "Boss Fight", icon: "boss" },
];

function ScoreRing({ v, size = 54 }) {
  const r = size / 2 - 5, c = 2 * Math.PI * r;
  const col = v >= 80 ? C.green : v >= 40 ? C.yellow : C.orange;
  return (
    <div style={{ position: "relative", width: size, height: size }} title="Knowledge Score">
      <svg width={size} height={size}><circle cx={size / 2} cy={size / 2} r={r} stroke="#2a323d" strokeWidth="5" fill="none" />
        <circle cx={size / 2} cy={size / 2} r={r} stroke={col} strokeWidth="5" fill="none" strokeDasharray={c} strokeDashoffset={c * (1 - v / 100)} strokeLinecap="round" transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dashoffset .6s" }} /></svg>
      <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center", fontFamily: HEAD, fontWeight: 800, fontSize: size * 0.34, color: col }}>{v}</div>
    </div>
  );
}

function App() {
  const [s, setS] = useState(() => ({ ...DEFAULT, ...load() }));
  const [tab, setTab] = useState(s.tab || "map");
  const [lvlUp, setLvlUp] = useState(null);
  const [pops, setPops] = useState([]);
  const [sheet, setSheet] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const wide = useWide();
  const mutedRef = useRef(s.muted);
  mutedRef.current = s.muted;

  useEffect(() => { save({ ...s, tab }); }, [s, tab]);

  const award = useCallback((ok, xp = 0) => {
    if (!mutedRef.current) (ok ? SFX.good : SFX.bad)();
    setS(p => {
      const nx = p.xp + (ok ? xp : 0);
      const before = levelOf(p.xp), after = levelOf(nx);
      if (after > before) setTimeout(() => { setLvlUp(after); if (!mutedRef.current) SFX.level(); }, 250);
      const streak = ok ? p.streak + 1 : 0;
      return { ...p, xp: nx, streak, bestStreak: Math.max(p.bestStreak, streak), answered: p.answered + 1, correct: p.correct + (ok ? 1 : 0) };
    });
    if (ok && xp > 0) { const k = Math.random(); setPops(ps => [...ps, { k, xp }]); setTimeout(() => setPops(ps => ps.filter(x => x.k !== k)), 900); }
  }, []);

  useEffect(() => { if (lvlUp) { const t = setTimeout(() => setLvlUp(null), 2200); return () => clearTimeout(t); } }, [lvlUp]);

  const lvl = levelOf(s.xp), lo = levelFloor(lvl), hi = levelFloor(lvl + 1);
  const score = safetyScore(s);
  const props = { s, setS, award };

  const nav = (
    <nav style={wide
      ? { display: "grid", gap: 6, alignContent: "start" }
      : { position: "fixed", bottom: 0, left: 0, right: 0, display: "grid", gridTemplateColumns: "repeat(5, 1fr)", background: "#0f1318", borderTop: `1px solid ${C.line}`, zIndex: 20, paddingBottom: "env(safe-area-inset-bottom)" }}>
      {TABS.map(t => {
        const on = tab === t.id;
        return (
          <button key={t.id} onClick={() => setTab(t.id)} style={wide
            ? { display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 10, border: "none", cursor: "pointer", background: on ? `${C.yellow}1c` : "transparent", color: on ? C.yellow : C.mute, fontFamily: HEAD, fontWeight: 700, fontSize: 19, letterSpacing: 0.5, textTransform: "uppercase", borderLeft: `4px solid ${on ? C.yellow : "transparent"}`, textAlign: "left" }
            : { display: "grid", justifyItems: "center", gap: 3, padding: "9px 2px 8px", border: "none", cursor: "pointer", background: "transparent", color: on ? C.yellow : C.mute, fontSize: 11, fontWeight: 600, borderTop: `3px solid ${on ? C.yellow : "transparent"}` }}>
            <Icon name={t.icon} size={wide ? 22 : 22} />{t.label}
          </button>
        );
      })}
    </nav>
  );

  const hud = (
    <div style={{ display: "flex", alignItems: "center", gap: wide ? 18 : 10, flexWrap: "wrap" }}>
      <div style={{ minWidth: wide ? 220 : 130, flex: wide ? "none" : 1 }}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, fontWeight: 700, color: C.mute }}>
          <span><span style={{ color: C.yellow, fontFamily: HEAD, fontSize: 16 }}>LVL {lvl}</span> · {titleOf(lvl)}</span>
          {wide && <span>{s.xp} XP</span>}
        </div>
        <div style={{ height: 8, borderRadius: 5, background: "#222a33", marginTop: 5, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${(s.xp - lo) / (hi - lo) * 100}%`, background: `linear-gradient(90deg, ${C.orange}, ${C.yellow})`, transition: "width .5s" }} />
        </div>
      </div>
      <div title="Answer streak" style={{ display: "flex", alignItems: "center", gap: 4, color: s.streak >= 3 ? C.orange : C.mute, fontFamily: HEAD, fontWeight: 800, fontSize: 20 }}>
        <Icon name="flame" size={20} />{s.streak}
      </div>
      <ScoreRing v={score} size={wide ? 54 : 42} />
      <button onClick={() => setSheet(true)} title="Quick Memory Sheet" style={{ background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 9, color: C.text, padding: 8, cursor: "pointer" }}><Icon name="book" /></button>
      <button onClick={() => setS(p => ({ ...p, muted: !p.muted }))} title={s.muted ? "Unmute" : "Mute"} style={{ background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 9, color: C.text, padding: 8, cursor: "pointer" }}><Icon name={s.muted ? "mute" : "sound"} /></button>
    </div>
  );

  return (
    <div style={{ minHeight: "100vh", background: C.bg }}>
      <div style={{ height: 8, background: stripe(), animation: "stripes 3s linear infinite" }} />
      <header style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, padding: wide ? "14px 24px" : "10px 14px", borderBottom: `1px solid ${C.line}`, background: "#0f1318", flexWrap: "wrap", position: "sticky", top: 0, zIndex: 15 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 38, height: 38, borderRadius: 9, background: C.yellow, color: "#111", display: "grid", placeItems: "center" }}><Icon name="bolt" size={24} stroke={2.4} /></div>
          <div>
            <div style={{ fontFamily: HEAD, fontWeight: 800, fontSize: 22, letterSpacing: 1, lineHeight: 1 }}>I&C FUNDAMENTALS SIM</div>
            <div style={{ fontSize: 11, color: C.mute, fontWeight: 600, letterSpacing: 1.5 }}>E&I LEARNING ENGINE</div>
          </div>
        </div>
        {hud}
      </header>

      <div style={{ display: "grid", gridTemplateColumns: wide ? "230px 1fr" : "1fr", maxWidth: 1240, margin: "0 auto" }}>
        {wide && (
          <aside style={{ padding: "20px 14px", borderRight: `1px solid ${C.line}`, minHeight: "calc(100vh - 80px)", display: "flex", flexDirection: "column", gap: 18 }}>
            {nav}
            <div style={{ background: C.panel, borderRadius: 12, padding: 14, border: `1px solid ${C.line}`, fontSize: 13, color: C.mute, display: "grid", gap: 6 }}>
              <div style={{ fontFamily: HEAD, fontSize: 16, fontWeight: 800, color: C.text, letterSpacing: 1 }}>KNOWLEDGE SCORE {score}</div>
              <div>Vault mastery, zones cleared, scenarios, and boss best all feed it.</div>
              <div>Accuracy: <b style={{ color: C.text }}>{s.answered ? Math.round(s.correct / s.answered * 100) : 0}%</b> · Best streak: <b style={{ color: C.text }}>{s.bestStreak}</b></div>
              {s.certified && <div style={{ color: C.green, fontWeight: 700 }}>Certified on Boss Fight</div>}
            </div>
            <div style={{ marginTop: "auto" }}>
              {!confirmReset ? <button onClick={() => setConfirmReset(true)} style={{ background: "none", border: "none", color: C.dim, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontSize: 13 }}><Icon name="reset" size={16} />Reset progress</button>
                : <div style={{ fontSize: 13, color: C.mute }}>Wipe all progress? <button onClick={() => { setS({ ...DEFAULT }); setConfirmReset(false); }} style={{ background: C.red, color: "#111", border: "none", borderRadius: 6, padding: "3px 8px", cursor: "pointer", fontWeight: 700 }}>Yes</button> <button onClick={() => setConfirmReset(false)} style={{ background: "none", color: C.mute, border: `1px solid ${C.line}`, borderRadius: 6, padding: "3px 8px", cursor: "pointer" }}>No</button></div>}
            </div>
          </aside>
        )}
        <main style={{ padding: wide ? "24px 28px 48px" : "16px 16px 96px", minWidth: 0 }}>
          {tab === "map" && <PlantMap {...props} />}
          {tab === "panic" && <PermitPanic {...props} />}
          {tab === "sim" && <Simulator {...props} />}
          {tab === "vault" && <Vault {...props} />}
          {tab === "boss" && <Boss {...props} />}
          <div style={{ marginTop: 28, fontSize: 12, color: C.dim, lineHeight: 1.5 }}>
            Built from E&I fundamentals and troubleshooting patterns. 
            {!wide && <> · <button onClick={() => { if (confirmReset) { setS({ ...DEFAULT }); setConfirmReset(false); } else setConfirmReset(true); }} style={{ background: "none", border: "none", color: confirmReset ? C.red : C.dim, textDecoration: "underline", cursor: "pointer", fontSize: 12, padding: 0 }}>{confirmReset ? "Tap again to wipe progress" : "Reset progress"}</button></>}
          </div>
        </main>
      </div>
      {!wide && nav}

      {pops.map(p => <div key={p.k} style={{ position: "fixed", right: wide ? 60 : 20, top: wide ? 100 : 120, zIndex: 40, fontFamily: HEAD, fontWeight: 800, fontSize: 24, color: C.yellow, animation: "floatUp .9s ease-out forwards", pointerEvents: "none", textShadow: "0 2px 10px rgba(0,0,0,.6)" }}>+{p.xp} XP</div>)}

      {lvlUp && (
        <div onClick={() => setLvlUp(null)} style={{ position: "fixed", inset: 0, zIndex: 60, display: "grid", placeItems: "center", background: "rgba(0,0,0,.6)", cursor: "pointer" }}>
          <div style={{ textAlign: "center", animation: "levelUp .7s ease" }}>
            <div style={{ height: 14, background: stripe(), animation: "stripes .8s linear infinite", borderRadius: 4 }} />
            <div style={{ background: "#111", padding: "22px 40px", border: `3px solid ${C.yellow}` }}>
              <div style={{ fontFamily: HEAD, fontWeight: 800, fontSize: 22, color: C.mute, letterSpacing: 4 }}>LEVEL UP</div>
              <div style={{ fontFamily: HEAD, fontWeight: 800, fontSize: 84, color: C.yellow, lineHeight: 1 }}>{lvlUp}</div>
              <div style={{ fontFamily: HEAD, fontWeight: 700, fontSize: 26, color: C.text, letterSpacing: 1 }}>{titleOf(lvlUp).toUpperCase()}</div>
            </div>
            <div style={{ height: 14, background: stripe(), animation: "stripes .8s linear infinite", borderRadius: 4 }} />
          </div>
        </div>
      )}
      {sheet && <QuickSheet onClose={() => setSheet(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
